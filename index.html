<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Borç Alacak" />
  <title>Borç Alacak</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Borç & Alacak</h1>
      <p>Basit kişisel takip</p>
    </div>
    <button id="installBtn" class="ghost hidden">Yükle</button>
  </header>

  <main>
    <section class="summary">
      <article class="card stat">
        <span>Toplam Alacak</span>
        <strong id="totalReceivable">₺0,00</strong>
      </article>
      <article class="card stat">
        <span>Toplam Borç</span>
        <strong id="totalDebt">₺0,00</strong>
      </article>
      <article class="card stat net">
        <span>Net Durum</span>
        <strong id="netBalance">₺0,00</strong>
      </article>
    </section>

    <section class="card form-card">
      <h2>Yeni Kayıt</h2>
      <form id="entryForm">
        <div class="grid">
          <label>
            Kişi / Firma
            <input id="person" required maxlength="60" placeholder="Örn. Ahmet Yılmaz" />
          </label>
          <label>
            Tür
            <select id="type">
              <option value="receivable">Alacak</option>
              <option value="debt">Borç</option>
            </select>
          </label>
          <label>
            Tutar
            <input id="amount" required type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00" />
          </label>
          <label>
            Tarih
            <input id="date" required type="date" />
          </label>
        </div>
        <label>
          Açıklama
          <input id="note" maxlength="120" placeholder="İsteğe bağlı" />
        </label>
        <button class="primary" type="submit">Kaydı Ekle</button>
      </form>
    </section>

    <section class="toolbar">
      <input id="search" placeholder="Kişi veya açıklama ara" />
      <select id="filter">
        <option value="all">Tümü</option>
        <option value="receivable">Alacaklar</option>
        <option value="debt">Borçlar</option>
        <option value="open">Açık Kayıtlar</option>
        <option value="closed">Kapananlar</option>
      </select>
    </section>

    <section id="list" class="list"></section>

    <section class="card backup">
      <h2>Yedekleme</h2>
      <div class="actions">
        <button id="exportBtn" class="secondary">Yedeği İndir</button>
        <label class="secondary file-label">
          Yedek Yükle
          <input id="importFile" type="file" accept=".json,application/json" />
        </label>
        <button id="clearBtn" class="danger">Tüm Verileri Sil</button>
      </div>
      <p class="hint">Veriler yalnızca bu cihazın tarayıcısında saklanır.</p>
    </section>
  </main>

  <dialog id="paymentDialog">
    <form method="dialog" id="paymentForm">
      <h3>Ödeme Ekle</h3>
      <p id="paymentInfo"></p>
      <label>
        Ödeme Tutarı
        <input id="paymentAmount" type="number" inputmode="decimal" min="0.01" step="0.01" required />
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Vazgeç</button>
        <button id="paymentSave" value="default" class="primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <template id="emptyTemplate">
    <div class="empty card">
      <strong>Henüz kayıt yok</strong>
      <span>İlk borç veya alacak kaydınızı yukarıdan ekleyin.</span>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
